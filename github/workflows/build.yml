name: Build Ludo APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      - name: Create Flutter project
        run: flutter create --org com.ludoking --project-name ludo_master .
      - name: Copy our files
        run: |
          cp -r lib/* /tmp/lib_backup/ 2>/dev/null || true
          mkdir -p /tmp/lib_backup
          cp -r lib/* /tmp/lib_backup/
          flutter create --org com.ludoking --project-name ludo_master .
          cp -r /tmp/lib_backup/* lib/
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
